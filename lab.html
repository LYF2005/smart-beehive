me only leans on them through two rubber pads."],porchScrews:["Porch screws","Four M4 \xD7 10 A2 stainless button screws through the tabs on the porch sides into rivet nuts pressed into the entrance plate. Undo them to take the porch and gate off for cleaning at the end of the season."],studs:["Brick decks","Two small decks on the front corners of the landing board with a 4 \xD7 4 grid of 8 mm studs, compatible with common toy construction bricks, in the hive colour. Owners can add their own figures and decorations. They are outside the camera view and to the side of the flight path."],covers:["Upright covers","Folded aluminium covers in the same graphite powder coat as the frame. They close the upright channels; the right one hides the cables. They clip in without screws."],clips:["Wall clips (top fixing)","Two small folded aluminium clips, each screwed to the first hive body with two 4 \xD7 25 mm A2 stainless screws, hold the outer edges of the uprights against the wall at the top. The frame itself is never screwed to the body: to lift the first body, lift off the head, and the clips slide up off the uprights with the body."],seal:["Wall seal","EPDM foam strip behind the top edges of the frame, pressed against the hive wall, so rain running down the wall cannot get behind the frame."],flashing:["Roof flashing","The back edge of the roof is turned up 16 mm with an EPDM strip pressed against the hive wall, like the flashing where a porch roof meets a house. Rain running down the wall lands on the roof and runs off at the eaves, never behind the roof or onto the pod."],border:["Hive colour border","The wooden landing board is painted in the hive colour around the grey insert (sides and front) and on its front lip, with dots, stripes or chevrons in a contrasting colour. Bee-safe water-based paint. Beekeepers already paint hive fronts in different colours so bees find their own hive and drift less between hives. Bees see blue, yellow and white well and red as black, so the colours are blue, yellow, white and graphite. It is outside the camera view."],antenna:["Wi-Fi antennas","Two flat dual-band (2.4 / 5 GHz) antennas on the back of the wooden front gable, either side of the pod and tilted apart for polarisation diversity, on short U.FL cables into the pod. Wood and polycarbonate let radio through; the metal pod and the aluminium solar roof would not."],channel:["Cable upright","The right upright is a closed box section. The PoE cable and the gate cable run up inside it to the apex and along the ridge beam to the pod: no cable is in the sun, in the rain or in front of the lens."],gland:["Cable entries","Under the foot of the right upright, facing the ground: the PoE cable gland and the accessory socket. Water runs off them, not into them, and the cable leaves with a drip loop."],m12:["Accessory port","M12 8-pin socket with the pinout of the beehive scale front connector: 5 V out, ground, 1-Wire, UART, wake and shield. One short lead to the scale powers the scale pod from the Observer and shares time and readings, so the scale needs no solar board and both upload through one link."],thumb:["Apex hook","The ridge beam ends in a hook that drops into a pocket at the apex of the wall frame, locked by one captive honey-yellow thumbscrew. The head lifts off in seconds and always lands in the same place, with the camera aimed the same way."],beam:["Ridge beam","Standard 30 \xD7 36 mm aluminium extrusion from the apex forward, under the ridge. It carries the roof, the front rafters and the pod, and the cables run inside it."],rafter:["Front rafters","Two slim folded strips under the front edge of the roof, from the end of the ridge beam to the eaves. They carry snow on the front corners. They sit above the lens, outside the view."],pod:["Camera + compute pod","The only machined metal part: a 170 \xD7 140 mm piece of finned aluminium extrusion, IP65, with printed end caps. It holds the camera, the compute sled and the supervisor, and it is the heatsink: the fins sit in the ventilated space under the roof. No fan to clog with dust or propolis."],camera:["Camera module","8 MP (3840 \xD7 2160) Sony STARVIS 2 sensor on its own MIPI CSI board with a locked-focus, low-distortion M12 lens, 90\xB0 wide. It sits 186 mm above the board, 135 mm out from the hive, tilted 16\xB0 back toward the hive: it sees nearly the whole board, the porch with the gate and the bottom of the hive wall, so bees that land on the wall are tracked from the moment they land. The camera and the board are both fixed to the wall frame, so the view is calibrated once at the factory with a printed target; in use, the software checks the straight edges of the porch lintel and board against that reference and raises an alert if the head was knocked. On the board that gives about 9.5 px per mm: a bee is about 125 px long and a varroa mite about 14 px. A global-shutter module can replace it without changing the pod."],hood:["Lens hood + window","Matt black cone with a flat AR-coated glass window at its tip, facing the ground. Rain cannot reach it, the sky never reflects in it and the roof keeps direct sun off it. A 0.3 W heater film clears dew on cold mornings."],led:["Light bars","Two short diffused LED bars beside the lens, with crossed polarisers on the LEDs and the lens to remove glints from shiny bees and wet pollen. They only flash in sync with the exposure at dusk or in deep shade, so they add less than 0.3 W on average."],mic:["Microphone","MEMS microphone behind a mesh under the pod. Entrance audio (drone flight, piping, hornets, fanning) is stored with the counts for audio + video models, and a hornet buzz is a second trigger for the gate."],sensor:["Light + climate sensor","Ambient light, temperature and humidity. The supervisor uses them to decide when bees can fly, which is when the computer has to run, and to narrow the gate on cold nights."],supervisor:["Supervisor board","Always-on ESP32-S3 board, the same carrier design as the beehive scale: PoE+ input, 12\u201324 V DC input, solar charger, fuel gauge, the gate motor driver and a load switch for the compute sled. It idles at about 0.1 W, only powers the computer when bees can fly, and moves the gate on its own when needed (cold night, lost power, expired hornet guard)."],compute:["Compute cassette","Raspberry Pi 5 (8 GB), Hailo-8 26 TOPS accelerator and 256 GB NVMe on one sled. It slides out of the front of the pod after a quarter-turn. The sled is the upgrade path: pod, camera, power and connectors stay the same, and a Jetson Orin NX or the next accelerator slides into the same bay when pose models need more compute."],face:["Service face","Honey-yellow front of the compute cassette, set into the front gable: activity display, status ring, setup button and a USB-C port under a flap for copying full-resolution research clips on site."],display:["Activity display","Cheap reflective 2-row segment LCD (about \u20AC3), readable in direct sun and needing no backlight: today\u2019s bees in (\u2193) and out (\u2191), with bars for the gate position. The always-on supervisor drives it through an HT1621 chip at about 50 \xB5A, updates it every minute and keeps the last numbers while the computer sleeps. The button pages through yesterday, net flow and alerts."],gable:["Gables","The roof is closed at both ends. At the back the wall frame sheet fills the triangle between the rafters. At the front a panel of oiled thermo-treated pine closes the roof above the pod: the pod face sits in it, vent slots under the ridge let warm air out, and the Wi-Fi antennas sit behind it, where wood lets the signal through."],battery:["Battery cassette","Solar version: four LiFePO4 32700 cells (12.8 V, 77 Wh) on a sled that slides out of the left side of the pod, charged from the roof panels. LiFePO4 tolerates summer heat better than Li-ion. In the PoE version this bay is empty or holds an LTE modem."],blank:["Side bay cover","Cover of the pod side bay. Behind it goes the battery cassette (solar version) or an LTE modem for apiaries without Wi-Fi or Ethernet."],canopy:["Roof","A 3 mm opal (light-diffusing), UV-stabilised polycarbonate sheet bent once along the ridge into a 30\xB0 gable, 448 \xD7 212 mm, from the hive wall forward. At 30\xB0 rain and snow slide off, to the sides: the eaves overhang the landing board edges, so drips fall beside the board, outside the view. Opal keeps its shadow on the board soft. It rests on the rafters of the wall frame at the back, the ridge beam and the front rafters."],solarCanopy:["Solar roof","The same gable in white powder-coated aluminium sheet (recyclable, unlike composite panel) with a 7 W ETFE panel laminated on each slope (14 W). Whichever way the hive faces, one slope gets the morning or afternoon sun. Bees fly when the sun shines, so the panels produce the most when the Observer has the most to do."],porch:["Entrance porch","A 46 mm deep, 17 mm high tunnel across the full entrance, in the same matt grey as the board. It moves the doorway forward onto the landing board: a bee that lands on the hive wall has to walk down onto the porch roof and step off in front of the mouth, so every bee in or out crosses the porch mouth in view. The mouth is the counting line. Open to the air, with no glass to clean or fog up."],gate:["Automatic entrance gate","A 2 mm plate that rises out of a slit in the porch floor at the mouth, with a 70 mm notch in its centre. One travel gives four positions: open (flush with the floor), reduced (only the 70 \xD7 17 mm centre open, against wind, cold and robbing), hornet guard (a 70 \xD7 5.5 mm slot: bees pass, hornets and wasps cannot) and closed (moving the hive, spraying nearby). It rises slowly with a soft silicone edge and a current limit, and only when the camera sees no bee in the mouth, so it cannot crush bees. Hidden under the floor when open."],gateDrive:["Gate drive housing","Sealed box of folded aluminium sheet with a gasketed lid, under the porch floor, outside the camera view, 336 \xD7 18 mm with a gearbox bulge in the middle. Drain holes in the bottom let water and debris that fall through the slit out. Its lead plugs into the foot of the right upright. Tick \u201CSee inside the gate\u201D to look through it."],gateMotor:["Motor + worm","N20-size micro stepper with a brass worm on its shaft, meshing with the worm wheel at the foot of the lead screw. A worm drive is self-locking: the gate holds any position without power, and bees or hornets cannot push it. About 1 W for 5 s per move."],gateScrew:["Lead screw + nut","Vertical 2 mm-lead screw turned by the worm wheel; a brass nut on the gate turns its rotation into 34 mm of travel, about 7 mm/s. The camera and a motor current limit stop it if a bee is in the way."],gateGuide:["Guide rods","Two stainless rods at the ends of the housing, with bronze bushings on the gate, so the 312 mm plate rises level and does not jam in the slit."],gateSensor:["Home sensor","Hall sensor on the housing floor and a magnet on the gate: the drive finds the open position after every power-up and counts steps from there."],gateSupercap:["Fail-open supercapacitor","Driver board with a supercapacitor that stays charged. If power is lost, it has enough energy to drive the gate back to open: the gate fails open, never closed."],lintel:["Gate lintel","The raised front edge of the porch roof. The gate slides up into it, and it marks the counting line from above."],board:["Landing board","15 mm thermo-treated pine (no chemicals, stable outdoors), hinged to the front of the porch floor at a 6\xB0 slope so rain drains off, with an aluminium stiffener underneath. A flush grey HDPE insert covers only the area the camera sees; the rest of the wood is painted in the hive colour."],insert:["Board insert","Flush 3 mm matt grey HDPE plate: the background of every frame. Neutral light grey, because white would overexpose in the sun and hide pale pollen loads. It slides out forward for washing off droppings, dead bees and propolis, and is the only plastic the camera sees."],hinge:["Board hinge","Stainless pins at the front of the porch floor. The board folds up flat for shipping and swings down if something hits it."],harness:["Internal harness","PoE, accessory and gate lines from the foot of the right upright, up inside it, over the rafter and along the ridge beam to the supervisor board in the pod."],cable:["Cables","One PoE cable (power and data, up to 100 m) from under the right upright, run along the ground. With the scale, one short M12 lead joins the Observer and the scale."],fov:["Camera field of view","What the camera sees: the bottom of the hive wall, the porch with the gate and the landing board, about 400 mm across. The frame, roof, pod and cables are all outside it."],bee:["Bees","Honey bees on the landing board, on the porch roof and on the hive wall. At 4K each worker is about 125 px long, big enough for pose keypoints, pollen loads and mites."],hive:["Hive","A standard hive: bottom board, bodies and lid. The only change is the wall frame screwed to the bottom board."],stand:["Hive stand","Any stand works: the Observer hangs on the hive entrance and does not touch the stand."],scale:["Beehive scale","Gratheon beehive scale, simplified. The Observer stands on its front rail with two risers, and one M12 lead powers the scale pod and carries its readings."],scaleLink:["Scale connector","M12 socket under the front rail of the beehive scale. The Observer lead plugs in here in place of the solar landing board."],robot:["Robotic Beehive","Ghost of the Robotic Beehive cabinet. Its entrance tunnel ends in the Observer porch, and the cable runs inside the cabinet to the robot PoE switch."]},rn=i=>i*Math.PI/180;function P_(i){let e=i.hive,t=i.robot,n=i.scale,s,r,o,a;i.context==="scale"?(r=n.feet+n.height,o=e.bottomBoard,a=r+12,s=[0,a,n.deck.d/2+14]):i.context==="robot"?(r=t.plinth+t.bottomBoard,o=t.bottomBoard,a=r-e.slot,s=[0,a,t.post.z+t.e/2+t.clad]):(r=i time."],fork:["Fork fingers","A servo turns a steel shaft 90\xB0 to swing two fingers under the box cleats. They stay folded down whenever they are not lifting. Painted yellow as a pinch-hazard colour."],loadcell:["Load cell","A bar load cell in each fork bearing block. It weighs the lifted part of the stack (per-box honey weight for free) and detects collisions: if the load drops before the expected landing height, the robot stops."],cleat:["Lift cleat","Stainless 30\xD730 angle screwed to both sides of every box and the lid. The forks lift on it. It also works as a hand grip for manual beekeeping."],scanBeam:["Scan beam (\xD72)","Second pair of beams, also NEMA23 + TR16\xD74 lead screws (self-locking, so a frame never drops). They raise the selected frame straight up out of its box, so bees that drop off fall back into their own box."],shuttle:["Frame shuttle","Runs front/back along the scan beam on a GT2 belt. It carries the hook and an inductive sensor that finds the steel frame pins."],belt:["Shuttle drive","NEMA17 + GT2 belt, TMC2209 in StealthChop mode, so it is nearly silent. Bees feel substrate vibration strongly."],hook:["Frame hook","A servo swings an L-shaped hook over the box wall. The slotted tip slides sideways under the frame pin, so it never presses down onto bees. Once the frame hangs, the pin head drops into a 1.5 mm pocket, so the frame can be carried in either direction."],camera:["Frame camera (\xD72)","One 12 MP camera per face (IMX477 class, 3.6 mm low-distortion M12 lens, about 83\xB0 \xD7 67\xB0), 240 mm from the comb and looking straight at it, plugged straight into the Orin Nano\u2019s two CSI ports. They hang from the lift beams, not from the frame carrier: while a box is open the lift beams stand still 425 mm above its rim, whatever the box, so the cameras are always 160 mm above the rim and the scan beam lifts each frame until its comb centre is level with them. Deep brood frames and shallow super frames are both centred. Every frame is photographed at the same photo spot, so focus and mm per pixel never change (about 9.5 px/mm: a cell is ~50 px, an egg ~14 px). The middle of the comb is seen almost straight down the cells; the corners at up to ~46\xB0, which shows larvae and capping but not eggs at the very bottom of a cell."],rimCam:["Rim camera (\xD72)","Small camera under each lift beam, looking down at the box rim. Before closing, it counts bees on the contact edges and looks for burr comb across the seam."],strobe:["Ring strobe","White LED ring around each lens, flashed only during the exposure. A polariser on the ring and a crossed one on the lens remove glare from wet nectar and capped honey, so the camera sees into the cells."],redLight:["Red work light","Bees barely see light above ~620 nm, so the cabinet interior is lit deep red during the whole inspection."],leadScrew:["Lead screw","TR16\xD74 trapezoidal lead screw, self-locking (lead angle \u22484.5\xB0). It is hung from a thrust bearing in the crown. Dry PTFE lubrication, no grease to trap debris or bees."],nema23:["NEMA23 lift motor","Driven by a DM542 driver. Four of them: two lift beams and two scan beams. Lifting 80 kg of upper boxes needs \u22480.8 N\xB7m per side with TR16\xD74."],nema17:["NEMA17 motor","Drives a shuttle belt. TMC2209 driver on the motion board. StallGuard detects jams."],box:["Hive body","A standard wooden hive body: deep boxes (285 mm) for the brood nest, shallow supers (170 mm) for honey, in any order. Only change needed: two cleats and steel frame pins. The robot knows each box\u2019s height from the stack settings. Nothing robotic lives inside the bee space."],lid:["Insulated inner cover","Wood-fibre insulated lid with cleats. The cabinet roof handles rain, so the hive lid stays light."],frame:["Frame","Estonian frame, 448 mm top bar: 279 mm deep in brood boxes, 164 mm in supers. Frames are kept vertical at all times: warm, heavy comb breaks if it is tilted."],comb:["Comb","Brood frames: capped brood in the centre, honey arc on top. Super frames: capped honey. This is what the cameras capture on every inspection."],pin:["Robot frame pin","A stainless M5 shoulder screw on each ear of the top bar (\u22480.20 \u20AC per frame). The hook grips it. The inductive sensor locates each frame to \xB10.5 mm."],tag:["Frame ID tag","ArUco marker on the end bar. The frame keeps its identity when it moves between boxes, so the web app can track each frame side over time."],bottomBoard:["Varroa sump","Tall screened bottom board. Mites fall through the mesh onto a white tray. A corner camera counts them every day. No moving parts."],varroaCam:["Varroa camera","Wide-angle camera with a ring light inside the sump, looking across the white tray."],cladding:["Cladding","Vertical thermo-treated pine boards. They are weatherproof without chemical preservatives, which can harm bees. Backed by wood-fibre insulation."],plinthClad:["Charred-wood skirt","Yakisugi (charred) boards resist rot and splashing at ground level without any chemicals."],door:["Service door","Full-height door at the back, away from the entrance, so opening it never puts the beekeeper in the bees\u2019 flight path. It swings out on three hinges (tick \u201COpen service door\u201D to see it). Opening it cuts motor power (interlock), and the forks can then be folded away so the hive can be worked by hand."],window:["Viewing window","600 \xD7 380 mm polycarbonate window in the service door at the height where frames are photographed, so visitors can watch an inspection. A wooden shutter keeps the cabinet dark between inspections."],roof:["Roof","Ventilated double roof with 60 mm overhang and drip edges. The air gap keeps summer heat off the hive."],solar:["Solar panel","About 100 W, south-facing. With the always-on ESP32 at ~0.2 W and the Jetson woken only for inspections, the tower runs off-grid most of the year."],antenna:["Antenna fin","RF-transparent ASA fin on the roof ridge with the LTE, LoRa 868 MHz, Wi-Fi and GNSS antennas. Surge arrestors sit where the cables enter the crown."],vent:["Hex vent band","Hexagon ventilation slots in bronze-anodised aluminium, backed by insect mesh. Crown heat leaves here and does not heat the hive."],estop:["Emergency stop","Latching mushroom switch on the fixed stile at the back, right next to the door handle, so it can be hit without opening anything. Opening the door already stops the motors (interlock), so the stop button is for when something goes wrong with the door closed. It cuts 24 V motor power only; the computers keep running and log the event."],status:["Status display","E-paper panel on the service door (black, white and red), readable in full sun and powered only when it changes. It shows what the last inspection found: queen seen, frames with eggs and brood, varroa level and trend, honey flow and weight, inside climate, and the next planned visit. Red marks what needs attention. The light bar under it is the robot state: slow yellow pulse = idle, solid yellow = inspecting (do not open the door), red = needs attention."],jetson:["Jetson Orin Nano","Runs inspections, cameras and detection models (bees, queen, varroa, brood). It sends sequences to Klipper over the Moonraker API."],mcu:["Motion board","BTT Octopus-class board running Klipper firmware. It generates step pulses in real time (not Python on the GPIO), handles endstops, servos, fans and the heater."],dm542:["DM542 drivers","External drivers for the four NEMA23 motors. Step/dir signals come from the motion board."],dcdc:["DC-DC converters","Converts 24 V to 19 V for the Orin Nano and 24 V to 5 V for the servos and LEDs. Each output is fused."],modem:["LTE modem","USB LTE modem for sites without Wi-Fi."],lora:["ESP32 + LoRa","Always-on supervisor, about 0.2 W. It reads temperature, humidity and weight, sends LoRa telemetry, wakes the Jetson via a relay and runs the watchdog."],psu:["24 V PSU","Mean Well 24 V ~ 350 W in a sealed box. The motor rail goes through the E-stop and
